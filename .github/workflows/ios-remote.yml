name: iOS Remote

# 交互式远程会话 (已知最佳实践: noVNC + Cloudflare 免注册临时隧道):
# 模拟器装好 app 后启动 GUI 窗口, 由 pipx 安装的 websockify 托管 noVNC 静态前端
# 并将原生 VNC (5900) 转为 WebSocket (6080), 经 Cloudflare Quick Tunnel (cloudflared)
# 打通免注册、免 Token、免 Secret 的公网 HTTPS 隧道。
# 本地 Windows 纯浏览器打开直连, 零软件安装, 即点即测 UI/UX。
#
# 应用包来源: 从 multiplatform-test Release 拉取最新 legado-*-ios-simulator.zip
# (由 ios.yml stage=simulator 产出并发布); 触发前确保已有包。
# 用途边界: 仅限个人合法开发与 UI/UX 调试, 会话参数化超时回收, 支持随时 Cancel 销毁。

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: '会话保持时长(分钟), 到点自动结束; 提前结束请直接 Cancel run'
        required: true
        default: '60'
        type: choice
        options:
          - '30'
          - '60'
          - '90'
          - '120'
          - '180'

concurrency:
  group: ios-remote-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  remote:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 360
    steps:
      - name: Download simulator build
        id: simdl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # 资产名带版本号 (3.%y.%m%d%H%M), 字典序最大即最新一套
          ASSET="$(gh release view multiplatform-test --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[].name | select(endswith("-ios-simulator.zip"))] | sort | last // empty')"
          if [ -z "$ASSET" ]; then
            echo "::error::multiplatform-test Release 没有 ios-simulator 资产, 先跑 ios.yml (stage=simulator) 发包"
            exit 1
          fi
          echo "asset=$ASSET"
          rm -rf /tmp/simapp && mkdir -p /tmp/simapp/x
          gh release download multiplatform-test --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir /tmp/simapp
          unzip -q "/tmp/simapp/$ASSET" -d /tmp/simapp/x
          APP="$(find /tmp/simapp/x -maxdepth 3 -name '*.app' | head -1)"
          test -n "$APP"
          APP="$(cd "$(dirname "$APP")" && pwd)/$(basename "$APP")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          {
            echo "app=$APP"
            echo "bundleId=$BUNDLE_ID"
          } >> "$GITHUB_OUTPUT"
          echo "bundleId=$BUNDLE_ID"

      # ===== 模拟器: 创建 → 启动 → 安装 → 打开桌面窗口 =====
      - name: Boot iOS simulator
        id: boot
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/sim-artifacts"
          {
            # 预热 CoreSimulatorService 缓存并清理同名残留
            xcrun simctl list >/dev/null 2>&1 || true
            xcrun simctl delete legado-remote 2>/dev/null || true

            # runner 预装多套 iOS runtime; 取当前最高一套, 避免写死设备名
            RUNTIME="$(xcrun simctl list runtimes --json \
              | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")]; rs.sort(key=lambda r: [int(x) for x in r["version"].split(".")]); print(rs[-1]["identifier"] if rs else "")')"
            echo "runtime=$RUNTIME"
            DEVICE_TYPE="$(xcrun simctl list devicetypes --json \
              | python3 -c 'import json,sys; ds=[d for d in json.load(sys.stdin)["devicetypes"] if "iPhone" in d["name"]]; print(next((d["identifier"] for d in ds if any(k in d["name"] for k in ["17", "16", "15", "14"])), ds[-1]["identifier"] if ds else ""))')"
            echo "deviceType=$DEVICE_TYPE"
            test -n "$RUNTIME" && test -n "$DEVICE_TYPE"
            UDID="$(xcrun simctl create legado-remote "$DEVICE_TYPE" "$RUNTIME")"
            echo "udid=$UDID" >> "$GITHUB_OUTPUT"
            echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl list devices | grep -i legado-remote || true
          } 2>&1 | tee "$GITHUB_WORKSPACE/sim-artifacts/10-boot.log"

      - name: Install and launch app
        id: launch
        run: |
          set -o pipefail
          UDID="${{ steps.boot.outputs.udid }}"
          APP="${{ steps.simdl.outputs.app }}"
          BUNDLE_ID="${{ steps.simdl.outputs.bundleId }}"
          OUT="$GITHUB_WORKSPACE/sim-artifacts"
          {
            xcrun simctl install "$UDID" "$APP"
            LAUNCH_OUT="$(xcrun simctl launch "$UDID" "$BUNDLE_ID" 2>&1 || true)"
            echo "$LAUNCH_OUT"
            PID="$(echo "$LAUNCH_OUT" | sed -n 's/.*: \([0-9][0-9]*\)$/\1/p')"
            sleep 5
            xcrun simctl io "$UDID" screenshot "$OUT/30-launch-5s.png" || true
            # 设置模拟器窗口缩放比 50% 防超出 1080p 屏幕, 并启动前台窗口
            defaults write com.apple.CoreSimulator.SimulatorFrame SimulatorWindowLastScale 0.5 2>/dev/null || true
            open -a Simulator --args -CurrentDeviceUDID "$UDID"
            sleep 2
            osascript -e 'tell application "Simulator" to activate' 2>/dev/null || true
            sleep 3
            xcrun simctl io "$UDID" screenshot "$OUT/31-simulator-window.png" || true
            echo "app pid=${PID:-?}; 若上一步截图为空/白屏, 连上 VNC 后手动点图标重启应用即可"
          } 2>&1 | tee "$OUT/32-install-launch.log"

      # ===== 屏幕共享: macOS 原生 ARD VNC (5900) =====
      - name: Enable screen sharing (VNC)
        id: vnc
        env:
          INPUT_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -o pipefail
          # 优先使用配置的 secret; 若无 secret 则自动生成 8 位随机密码, 零配置可用
          # ⚠️ 协议硬约束: 原生 VNC (RFB 协议) 强制密码上限为 8 字符, 超出必须截断否则认证必败
          VNCPW="$INPUT_PASSWORD"
          if [ -z "$VNCPW" ]; then
            VNCPW="$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 8)"
          else
            VNCPW="${VNCPW:0:8}"
          fi
          echo "vncpw=$VNCPW" >> "$GITHUB_OUTPUT"

          KICKSTART=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          # 1. 写入 macOS 14/15 官方标准混淆 VNC 密文文件 (解决 Sonoma/Sequoia 下 setvncpw 偶发握手失败 bug)
          echo "$VNCPW" | perl -we '
          BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; 
          $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; 
          foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"
          ' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt >/dev/null

          # 2. 标准单密码 VNC (legacy 模式): 双重配置确保无论是读文件还是读内存均能认证
          sudo "$KICKSTART" -configure -allowAccessFor -allUsers -privs -all
          sudo "$KICKSTART" -configure -clientopts -setvnclegacy -vnclegacy yes
          sudo "$KICKSTART" -configure -clientopts -setvncpw -vncpw "$VNCPW"
          sudo "$KICKSTART" -activate
          sudo "$KICKSTART" -restart -agent -console
          # 检查 5900 端口监听就绪
          for i in $(seq 1 10); do
            if nc -z 127.0.0.1 5900 2>/dev/null; then
              break
            fi
            sleep 1
          done

      # ===== Web 桥接与隧道: noVNC + Cloudflare Quick Tunnel =====
      - name: Setup noVNC and Cloudflare Tunnel
        id: tunnel
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/sim-artifacts"

          # 1. macOS runner 预装 pipx: 独立沙盒安装 websockify (pip 兜底)
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx install --force websockify || pip install --user --break-system-packages websockify
          WS_BIN="$HOME/.local/bin/websockify"
          if [ ! -x "$WS_BIN" ]; then
            WS_BIN="$(which websockify 2>/dev/null || true)"
          fi
          test -n "$WS_BIN" && test -x "$WS_BIN"

          # 2. 浅克隆官方 noVNC 静态前端 (GitHub 机房内网极速拉取)
          rm -rf /tmp/novnc
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc
          test -f "/tmp/novnc/vnc.html"

          # 3. 启动 websockify: 监听 6080, 提供静态页面并将 WebSocket 请求代理到本地 5900
          nohup "$WS_BIN" --web /tmp/novnc 6080 127.0.0.1:5900 \
            > "$GITHUB_WORKSPACE/sim-artifacts/16-websockify.log" 2>&1 &
          WS_PID=$!
          echo "ws_pid=$WS_PID" >> "$GITHUB_OUTPUT"
          
          # 等待 websockify 6080 端口就绪
          for i in $(seq 1 10); do
            if nc -z 127.0.0.1 6080 2>/dev/null; then
              break
            fi
            sleep 1
          done

          # 4. 下载 Cloudflare 官方二进制 (自动识别 arm64/amd64 架构)
          ARCH="$(uname -m)"
          [ "$ARCH" = "x86_64" ] && CF_ARCH="amd64" || CF_ARCH="arm64"
          curl -sSLf --retry 3 --retry-delay 2 --connect-timeout 15 \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-${CF_ARCH}.tgz" \
            -o /tmp/cf.tgz
          tar -xzf /tmp/cf.tgz -C /tmp/
          chmod +x /tmp/cloudflared

          # ⚠️ 彻底消除 Apple Silicon 内核拦截: 移除隔离属性并补齐 ad-hoc 签名, 杜绝 Killed: 9
          xattr -rd com.apple.quarantine /tmp/cloudflared 2>/dev/null || true
          codesign --force --deep --sign - /tmp/cloudflared 2>/dev/null || true

          # 5. 启动 Cloudflare 隧道 (强制 http2 避免 UDP 丢包, 直写日志)
          touch "$GITHUB_WORKSPACE/sim-artifacts/15-cloudflared.log"
          nohup /tmp/cloudflared tunnel \
            --protocol http2 \
            --logfile "$GITHUB_WORKSPACE/sim-artifacts/15-cloudflared.log" \
            --url http://127.0.0.1:6080 >/dev/null 2>&1 &
          CF_PID=$!
          echo "cf_pid=$CF_PID" >> "$GITHUB_OUTPUT"

          # 6. 从日志解析分配的临时 *.trycloudflare.com 地址
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            if [ -f "$GITHUB_WORKSPACE/sim-artifacts/15-cloudflared.log" ]; then
              TUNNEL_URL="$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$GITHUB_WORKSPACE/sim-artifacts/15-cloudflared.log" | head -1 || true)"
              [ -n "$TUNNEL_URL" ] && break
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "::error::Cloudflare 隧道建立超时, 日志如下:"
            cat "$GITHUB_WORKSPACE/sim-artifacts/15-cloudflared.log" || true
            exit 1
          fi

          VNCPW="${{ steps.vnc.outputs.vncpw }}"
          # 构造免输入自动连接 URL: autoconnect=true, 缩放自适应, 自动填密
          DIRECT_URL="${TUNNEL_URL}/vnc.html?autoconnect=true&path=websockify&resize=scale&password=${VNCPW}"

          {
            echo "## 🚀 iOS 远程 Web 会话已就绪"
            echo ""
            echo "### 👉 [点击直接在浏览器中打开 iOS 模拟器]($DIRECT_URL)"
            echo ""
            echo "| 项目 | 信息 |"
            echo "| :--- | :--- |"
            echo "| **直连网址** | \`$DIRECT_URL\` |"
            echo "| **VNC 密码** | \`$VNCPW\` |"
            echo "| **会话时长** | 最多 ${{ inputs.session_minutes }} 分钟 (到点自动回收) |"
            echo "| **提前结束** | 在 GitHub Actions 页面直接点击 **Cancel workflow** |"
            echo ""
            echo "> **提示**："
            echo "> - 页面已配置自动连接、屏幕缩放自适应与密码预填，点击直连网址即可开始操作。"
            echo "> - 模拟器已启动并加载应用；如应用退出，在模拟器桌面上点击应用图标重新启动。"
            echo "> - 隧道走 Cloudflare 官方 CDN，无需注册账号、无需本地安装任何客户端软件。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep session alive
        id: keepalive
        run: |
          MINUTES="${{ inputs.session_minutes }}"
          TOTAL=$(( MINUTES * 60 ))
          ELAPSED=0
          CF_PID="${{ steps.tunnel.outputs.cf_pid }}"
          WS_PID="${{ steps.tunnel.outputs.ws_pid }}"

          while [ "$ELAPSED" -lt "$TOTAL" ]; do
            # 动态探活: 后台隧道或桥接若异常终止, 立即收拢报错退出, 严禁空跑
            if [ -n "$CF_PID" ] && ! kill -0 "$CF_PID" 2>/dev/null; then
              echo "::error::Cloudflare 隧道进程已意外终止, 查看 15-cloudflared.log"
              break
            fi
            if [ -n "$WS_PID" ] && ! kill -0 "$WS_PID" 2>/dev/null; then
              echo "::error::websockify 桥接进程已意外终止, 查看 16-websockify.log"
              break
            fi

            STEP=60
            REMAIN=$(( TOTAL - ELAPSED ))
            [ "$REMAIN" -lt "$STEP" ] && STEP=$REMAIN
            sleep "$STEP"
            ELAPSED=$(( ELAPSED + STEP ))
            if [ $(( ELAPSED % 300 )) -eq 0 ]; then
              echo "会话已保持 $((ELAPSED/60)) 分钟, 剩余 $(( (TOTAL-ELAPSED)/60 )) 分钟"
            fi
          done
          echo "本次远程会话结束, 进入产物留档与环境清理"

      # ===== 收尾: 收集崩溃日志与截图, Cancel 时亦执行 =====
      - name: Collect session artifacts
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          UDID="${{ steps.boot.outputs.udid }}"
          BUNDLE_ID="${{ steps.simdl.outputs.bundleId }}"
          OUT="$GITHUB_WORKSPACE/sim-artifacts"
          mkdir -p "$OUT/app-container" "$OUT/system-crash"
          {
            if [ -n "$UDID" ]; then
              xcrun simctl io "$UDID" screenshot "$OUT/90-end.png" || true
            fi
            screencapture -x "$OUT/91-desktop-end.png" || true
            if [ -n "$UDID" ] && [ -n "$BUNDLE_ID" ]; then
              if CONTAINER="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null)"; then
                cp -R "$CONTAINER/Documents/logs" "$OUT/app-container/" 2>/dev/null || true
                cp -R "$CONTAINER/Library/logs" "$OUT/app-container/" 2>/dev/null || true
              fi
              xcrun simctl spawn "$UDID" log show --last 30m --style compact \
                --predicate "processImagePath CONTAINS \"$BUNDLE_ID\" OR senderImagePath CONTAINS \"legado\"" \
                > "$OUT/95-sim-syslog.txt" 2>&1 || true
            fi
            for f in "$HOME"/Library/Logs/DiagnosticReports/*.ips; do
              [ -f "$f" ] || continue
              case "$(basename "$f")" in
                *legado*|*iosApp*|*shared*) cp "$f" "$OUT/system-crash/" ;;
              esac
            done
          } 2>&1 | tee "$OUT/96-collect.log"

      - name: Shutdown simulator
        if: always()
        continue-on-error: true
        run: |
          UDID="${{ steps.boot.outputs.udid }}"
          [ -n "$UDID" ] && xcrun simctl shutdown "$UDID" || true
          [ -n "$UDID" ] && xcrun simctl delete "$UDID" || true

      - name: Upload session artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-remote-session
          path: |
            ${{ github.workspace }}/sim-artifacts/**
          if-no-files-found: warn
          retention-days: 3
