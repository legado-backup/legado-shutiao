name: iOS Remote

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: '会话保持时长(小时)'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3']

concurrency:
  group: ios-remote-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-vnc-session:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Download & Install App
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ASSET="$(gh release view multiplatform-test --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[].name | select(endswith("-ios-simulator.zip"))] | sort | last // empty')"
          if [ -z "$ASSET" ]; then
            echo "::error::multiplatform-test 没有找到模拟器资产"
            exit 1
          fi
          rm -rf /tmp/simapp && mkdir -p /tmp/simapp/x
          gh release download multiplatform-test --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir /tmp/simapp
          unzip -q "/tmp/simapp/$ASSET" -d /tmp/simapp/x
          APP="$(find /tmp/simapp/x -name '*.app' | head -1)"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          UDID="$(xcrun simctl list devices 'iOS' available | grep -m1 'iPhone' | awk -F '[()]' '{print $2}')"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" || true
          open -a Simulator --args -CurrentDeviceUDID "$UDID"

      - name: Enable Screen Sharing
        run: |
          # 兜底: ARD 认证走系统账号, runner 密码随机生成, 重设为已知密码
          sudo dscl . -passwd /Users/runner "12345678"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "12345678" \
            -restart -agent -console

      # 启动代理和隧道: 本步骤执行完毕后退出, 触发 GitHub Actions 立即向网页推送 Notice
      - name: Start noVNC and Tunnel
        run: |
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/noVNC
          # 强制纯 VNC 密码认证: 新版 noVNC 按服务器偏好会优先选 ARD 系统账号认证
          sed -i '' '/securityTypeARD,/d' /tmp/noVNC/core/rfb.js
          nohup /tmp/noVNC/utils/novnc_proxy --vnc 127.0.0.1:5900 --listen 6080 >/dev/null 2>&1 &
          
          brew install cloudflared
          nohup cloudflared tunnel --protocol http2 --url http://127.0.0.1:6080 > /tmp/cf.log 2>&1 &
          
          URL=""
          for i in $(seq 1 30); do
            URL="$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)"
            [ -n "$URL" ] && break
            sleep 1
          done
          
          if [ -z "$URL" ]; then
            echo "::error::未获取到隧道 URL, 日志:"
            cat /tmp/cf.log
            exit 1
          fi
          
          PAGE="$URL/vnc.html?autoconnect=true&password=12345678"
          
          # 本 Step 结束时, 该 Notice 会立即呈现在 GitHub Actions 网页顶部的 Annotations 区域
          echo "::notice title=DIRECT_URL::$PAGE"
          echo "=========================================="
          echo "直连网址: $PAGE"
          echo "VNC 密码: 12345678"
          echo "=========================================="

      # 独立保活 Step: 保持会话运行, 不阻碍上一步向网页推送直连地址
      - name: Keep Alive
        run: |
          sleep $(( ${{ github.event.inputs.duration_hours }} * 3600 ))
